name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run test suite
        # No live Ollama, Docker, `kind`, or Jaeger in CI — every test here is the
        # self-contained kind (pure logic, mocked/fake dependencies, the MCP SDK's own
        # InMemoryTransport). Real-infrastructure verification for those pieces is done
        # manually and documented in RELEASEFORGE_BUILD_PLAN.md, not re-run here.
        run: python -m pytest tests/ -v

  extension-build:
    name: Extension build (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and compile
        run: npm run compile
